spring.application.name=LMS

server.port=8080

spring.config.import=optional:file:.env
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/database_lms?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



jwt.secret=${JWT_SECRET}


jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION}

jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}


spring.mail.host=smtp.gmail.com
spring.mail.port=587


spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


cloudinary.cloud-name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.flyway.enabled=false