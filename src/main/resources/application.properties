spring.application.name=LMS

server.port=8080

spring.config.import=optional:file:.env

# ===============================
# C?U HÌNH DATABASE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# C?U HÌNH JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



jwt.secret=${JWT_SECRET}

# Th?i gian s?ng c?a Access Token: 15 phút
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION}
# Th?i gian s?ng c?a Refresh Token: 7 ngày
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}